<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página con Menú</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        nav {
            background: #333;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }
        section {
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#nosotros">Nosotros</a>
        <a href="#contacto">Contacto</a>
    </nav>

    <section id="inicio">
        <h2>Inicio</h2>
        <p>Bienvenido a nuestra página web.</p>
    </section>
    <section id="nosotros">
        <h2>Nosotros</h2>
        <p>Somos una empresa dedicada a la tecnología.</p>
    </section>
    <section id="contacto">
        <h2>Contacto</h2>
        <p>Escríbenos a contacto@example.com</p>
    </section>
</body>
</html>
